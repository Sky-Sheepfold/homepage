# 每日在 GitHub Actions 内直接生成 README 统计卡（基于 GitHub 官方 API，不依赖任何第三方渲染服务）
# 由 lowlighter/metrics 生成，输出到 assets/stats/metrics.svg 并自动提交。
name: Update README metrics

on:
  schedule:
    # 每天北京时间 06:30（UTC 22:30）
    - cron: '30 22 * * *'
  # 支持手动补跑
  workflow_dispatch:
  # 本工作流文件更新时自动跑一次（首跑即由本文件的首次 push 触发）
  push:
    paths:
      - '.github/workflows/metrics.yml'

permissions:
  contents: write

concurrency:
  group: readme-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/stats/metrics.svg
          output_action: commit
          committer_message: "chore: update README metrics"
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
