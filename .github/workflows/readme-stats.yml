# 每日从 github-readme-stats 抓取统计卡片（亮/暗双主题），提交到 assets/stats/
# README 通过相对路径 <picture> 引用本地 SVG，访客侧不再依赖公共实例的运行时可用性。
name: Update README stats cards

on:
  schedule:
    # 每天北京时间 06:30（UTC 22:30）
    - cron: '30 22 * * *'
  # 支持手动补跑（公共实例故障恢复后想立即刷新时使用）
  workflow_dispatch:
  # 本工作流文件更新时自动跑一次（首跑即由本文件的首次 push 触发）
  push:
    paths:
      - '.github/workflows/readme-stats.yml'

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: true

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch stats cards
        run: |
          mkdir -p assets/stats
          curl -fL --retry 3 --retry-delay 5 --max-time 60 \
            -o assets/stats/stats-light.svg \
            "https://github-readme-stats.vercel.app/api?username=Sky-Sheepfold&locale=cn&hide_border=true&show_icons=true&rank_icon=github&card_width=420&theme=default&cache_seconds=86400"
          curl -fL --retry 3 --retry-delay 5 --max-time 60 \
            -o assets/stats/stats-dark.svg \
            "https://github-readme-stats.vercel.app/api?username=Sky-Sheepfold&locale=cn&hide_border=true&show_icons=true&rank_icon=github&card_width=420&theme=github_dark&cache_seconds=86400"
          curl -fL --retry 3 --retry-delay 5 --max-time 60 \
            -o assets/stats/top-langs-light.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Sky-Sheepfold&layout=compact&locale=cn&hide_border=true&langs_count=6&card_width=320&theme=default&cache_seconds=86400"
          curl -fL --retry 3 --retry-delay 5 --max-time 60 \
            -o assets/stats/top-langs-dark.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Sky-Sheepfold&layout=compact&locale=cn&hide_border=true&langs_count=6&card_width=320&theme=github_dark&cache_seconds=86400"

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update README stats cards"
            git pull --rebase origin main
            git push
          fi
